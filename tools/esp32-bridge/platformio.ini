; ESP32 classic-Bluetooth bridge for the DB50-B (job #1140).
; Needs an original ESP32 (WROOM-32 / D0WD). S3, C3 and C6 have no classic Bluetooth.
[env:esp32]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Bluetooth + Wi-Fi need a big app slot; min_spiffs keeps two (1.9 MB each) for Wi-Fi updates.
board_build.partitions = min_spiffs.csv
